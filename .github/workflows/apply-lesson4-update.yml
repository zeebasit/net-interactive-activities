name: Apply Lesson 4 activity update

on:
  push:
    paths:
      - '.github/workflows/apply-lesson4-update.yml'

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Recover and write updated Lesson 4 activity
        shell: bash
        run: |
          git show HEAD^:.github/workflows/apply-lesson4-update.yml | sed -n "/<<'PAYLOAD'/,/^PAYLOAD$/p" | sed '1d;$d' > /tmp/lesson4.b64
          base64 -d /tmp/lesson4.b64 | gzip -d > module1/lesson4/activity1/index.html
      - name: Commit updated activity
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add module1/lesson4/activity1/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Keep Lesson 1.4 challenge brief accessible and add creator credit'
            git push
          fi
